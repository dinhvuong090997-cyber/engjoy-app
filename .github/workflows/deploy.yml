name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
      - name: Fix asset paths for GitHub Pages
        run: |
          cd dist
          # Create index.html at root if not exists
          if [ -f "_expo/static/js/web/index.html" ]; then
            cp _expo/static/js/web/index.html index.html
          fi
          # Ensure all HTML files exist
          find . -name "*.html" | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
