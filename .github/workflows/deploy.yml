name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Patch Expo Router base path for GitHub Pages
        run: |
          for file in \
            node_modules/expo-router/build/fork/getStateFromPath-forks.js \
            node_modules/expo-router/build/fork/getPathFromState-forks.js \
            node_modules/expo-router/build/fork/getPathFromState.js
          do
            perl -0pi -e 's/baseUrl = process\.env\.EXPO_BASE_URL/baseUrl = "\/engjoy-app\/"/g' "$file"
          done
      - run: |
          EXPO_BASE_URL=/engjoy-app/ npx expo export --platform web --output-dir dist
          echo "EXPO_BASE_URL=/engjoy-app/"
      - name: Fix asset paths for GitHub Pages
        run: |
          cd dist
          # Fix paths in index.html (remove leading /)
          sed -i 's|href="/favicon.ico"|href="favicon.ico"|g; s|src="/_expo|src="_expo|g' index.html
          # Fix paths in JS bundle (remove leading /asset → asset)
          for js in _expo/static/js/web/*.js; do
            sed -i 's|"/assets/|"assets/|g' "$js"
          done
          touch .nojekyll
          # Create 404.html for SPA deep-link fallback (copy fixed index)
          cp index.html 404.html
          echo "Dist files:"
          ls -la
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
