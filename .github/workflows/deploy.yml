name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          EXPO_BASE_URL=/engjoy-app/ npx expo export --platform web --output-dir dist
      - name: Fix asset paths for GitHub Pages
        run: |
          cd dist
          # Fix paths in index.html (remove leading /)
          sed -i 's|href="/favicon.ico"|href="favicon.ico"|g; s|src="/_expo|src="_expo|g' index.html
          # Fix paths in JS bundle (remove leading /asset → asset)
          for js in _expo/static/js/web/*.js; do
            sed -i 's|"/assets/|"assets/|g' "$js"
          done
          find . -name "*.html" | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
